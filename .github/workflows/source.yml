name: Source checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python tools/regenerate_sources.py --check
      - run: sudo apt-get update
      - run: sudo apt-get install -y gfortran
      - run: python -m unittest discover -s tests -v
      - run: python tools/validate_explicit_typing.py
      - run: python tools/validate_final_returns.py
      - run: python tools/validate_deleted_do.py
      - run: python tools/validate_arithmetic_if.py
      - run: python tools/validate_remaining_features.py
      - run: python tools/validate_obsolescent.py
      - run: python tools/validate_storage.py
      - run: python tools/validate_blktri_bounds.py
      - run: python tools/validate_unused_labels.py
      - run: python tools/validate_goto_exits.py
      - run: python tools/validate_terminal_branches.py
      - run: python tools/validate_two_way_terminal_branches.py
      - run: python tools/validate_free_formatting.py
      - run: python tools/validate_data_constants.py
      - run: python tools/validate_generic_intrinsics.py
      - run: python tools/validate_fixed_generic_intrinsics.py
      - run: python tools/validate_redundant_copies.py
      - run: python tools/validate_declaration_sections.py
      - name: Verify additional argument intents
        run: python tools/validate_additional_intents.py
      - run: python tools/validate_ode_intents.py
      - run: python tools/validate_local_declarations.py
      - run: python tools/validate_procedure_purity.py
      - run: python tools/validate_sources.py
      - run: python tools/validate_interfaces.py
      - run: python tools/validate_module_pi.py
      - run: python tools/validate_module_simple_constants.py
      - run: python tools/validate_module.py
