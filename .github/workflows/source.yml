name: Source checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python tools/regenerate_sources.py --check
      - run: sudo apt-get update
      - run: sudo apt-get install -y gfortran
      - run: python -m unittest discover -s tests -v
      - run: python tools/validate_explicit_typing.py
      - run: python tools/validate_sources.py
      - run: python tools/validate_interfaces.py
